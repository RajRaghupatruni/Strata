services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-strata}
      POSTGRES_USER: ${POSTGRES_USER:-strata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strata-local-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - strata-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-docker}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-strata}:${POSTGRES_PASSWORD:-strata-local-password}@postgres:5432/${POSTGRES_DB:-strata}
      PUBLIC_DEMO_MODE: ${PUBLIC_DEMO_MODE:-false}
      RIOT_API_KEY: ${RIOT_API_KEY:-}
      RIOT_DEFAULT_REGION: ${RIOT_DEFAULT_REGION:-na}
      COACHING_AI_ENABLED: ${COACHING_AI_ENABLED:-false}
      COACHING_MODE: ${COACHING_MODE:-deterministic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        VITE_PUBLIC_DEMO_MODE: ${VITE_PUBLIC_DEMO_MODE:-false}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  strata-postgres-data:
