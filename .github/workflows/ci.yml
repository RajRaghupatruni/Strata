name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://strata:strata@localhost:5432/strata_ci
      ENVIRONMENT: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strata
          POSTGRES_PASSWORD: strata
          POSTGRES_DB: strata_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strata -d strata_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -B -m unittest discover -s tests -v

      - name: Validate Python compilation
        working-directory: backend
        run: python -B -m compileall -q app tests

      - name: Validate PostgreSQL migrations
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Check migrated PostgreSQL schema
        working-directory: backend
        run: >-
          python -c "from sqlalchemy import create_engine, inspect; import os;
          tables = set(inspect(create_engine(os.environ['DATABASE_URL'])).get_table_names());
          required = {'alembic_version', 'matches', 'coaching_reports', 'progress_snapshots', 'user_profiles', 'recommendations', 'review_notes', 'issue_tags'};
          missing = required - tables;
          assert not missing, f'Missing migrated tables: {sorted(missing)}'"

  frontend:
    name: Frontend typecheck, build, and audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pin npm version
        run: npm install --global npm@10.9.2

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc -b

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Audit runtime dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install audit tooling and dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip pip-audit && python -m pip install -r requirements.txt

      - name: Audit Python dependencies
        working-directory: backend
        run: pip-audit -r requirements.txt

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
